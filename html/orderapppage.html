<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="max-age=31536000, must-revalidate">
    <title>Hyperion-orderapp</title>
    <link rel="stylesheet" href="../css/orderapppage.css">
    <link rel="icon" href="../image/mainlogo/mainlogoinhead.png" type="image/x-icon">
</head>

<body class="bodyorderapppage">

    <div id="header"></div>

    <div class="fade-in">
        <div class="fade-in-section">
            <div class="orderapp-section">
    
                <div class="divglass">
    
                    <h1 class="titelfororderappbox">درخواست ساخت نرم افزار</h1>
    
                    <p class="pforappform">اینجا میتونید درخواستتون رو برای ساخت نرم افزار ثبت کنید همکاران در سریعترین زمان ممکن با شما تماس میگیرند.</p>
    
                    <form class="odrerapp-form" id="odrerapp-form">
    
                        <div class="input-container">
                            <input type="text" id="username" name="username" placeholder=" " maxlength="20">
                            <label for="name">نام کاربری</label>
                        </div>
    
                        <div class="input-container">
                            <input type="tel" placeholder=" " id="forgot-password-phone" maxlength="11">
                            <label for="forgot-password-phone">شماره تلفن</label>
                        </div>
    
                        <div class="input-container">
                            <textarea id="message" name="message" rows="4" placeholder=" "></textarea>
                            <label class="labeltextarea" for="message">جزئیات نرم افزار مورد نظر</label>
                        </div>
    
                        <div class="div-btnsendandback">
                            <a class="btnbackinorderapppage" href="../html/orderpage.html">بازگشت</a>
                            <button class="btnsendinorderapppage" type="submit">ارسال</button>
                        </div>
                      
    
                    </form>
    
                </div>
    
            </div>
        </div>
    </div>





    <div id="footer"></div>
    <script src="http://localhost/HYPERION/js/jackpot.js"></script>
    <script src="../js/orderapppage.js"></script>
    <script src="../js/jsforheaderandfooterlink.js"></script>

    <!-- <script src="/js/jsanimationforloadpages.js"></script> -->

</body>

</html>
