<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="max-age=31536000, must-revalidate">
    <title>Hyperion-ordersite</title>
    <link rel="stylesheet" href="../css/ordersitepage.css">
    <link rel="icon" href="../image/mainlogo/mainlogoinhead.png" type="image/x-icon">
</head>

<body class="bodyordersite">

    <div id="header"></div>

    <div class="fade-in">
        <div class="fade-in-section">
            <div class="ordersite-section">
    
                <div class="divglass">
    
                    <h1 class="titelforordersitebox">درخواست ساخت سایت</h1>
    
                    <p class="pforsiteform">اینجا میتونید درخواستتون رو برای ساخت وبسایت شخصی خودتون ثبت کنید همکاران در سریعترین زمان ممکن با شما تماس میگیرند.</p>
    
                    <form class="odrersite-form" id="odrersite-form">
    
                        <div class="input-container">
                            <input type="text" id="username" name="username" placeholder=" " maxlength="20">
                            <label for="name">نام کاربری</label>
                        </div>
    
                        <div class="input-container">
                            <input type="tel" placeholder=" " id="forgot-password-phone" maxlength="11">
                            <label for="forgot-password-phone">شماره تلفن</label>
                        </div>
    
                        <div class="input-container">
                            <textarea id="message" name="message" rows="4" placeholder=" "></textarea>
                            <label class="labeltextarea" for="message">جزئیات سایت مورد نظر</label>
                        </div>
    
                        <div class="div-btnsendandback">
                            <a class="btnbackinordersitepage" href="../html/orderpage.html">بازگشت</a>
                            <button class="btnsendinordersitepage" type="submit">ارسال</button>
                        </div>
    
                        
    
                    </form>
    
                </div>
    
            </div>
        </div>
    </div>

 



    <div id="footer"></div>
    <script src="http://localhost/HYPERION/js/jackpot.js"></script>
    <script src="../js/ordersitepage.js"></script>
    <script src="../js/jsforheaderandfooterlink.js"></script>


</body>

</html>
