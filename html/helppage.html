<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="max-age=31536000, must-revalidate">
    <title>Hyperion-help</title>
    <link rel="stylesheet" href="../css/helppage.css">
    <link rel="icon" href="../image/mainlogo/mainlogoinhead.png" type="image/x-icon">
</head>

<body class="bodyhelppage">

    <div id="header"></div>

    <div class="fade-in">
        <div class="fade-in-section">
            <div class="support-section">

                <div class="divglass">

                    <h1 class="titelforhelppagebox">ارتباط با پشتیبانی</h1>

                    <p class="pforhelpform">لطفاً سوالات و مشکلات خود را با ما در میان بگذارید. ما در اسرع وقت به شما پاسخ
                        خواهیم داد.</p>

                    <form class="support-form" id="supportForm">

                        <div class="input-container">
                            <input type="text" id="username" name="username" placeholder=" " maxlength="20">
                            <label for="name">نام کاربری</label>
                        </div>

                        <div class="input-container">
                            <input type="tel" placeholder=" " id="forgot-password-phone" maxlength="11">
                            <label for="forgot-password-phone">شماره تلفن</label>
                        </div>

                        <div class="input-container">
                            <textarea id="message" name="message" rows="4" placeholder=" "></textarea>
                            <label for="message">پیام</label>
                        </div>

                        <div class="div-btnsendandback">
                            <a class="btnbackinhelppage" href="../html/orderpage.html">بازگشت</a>
                            <button class="btnsendinhelppage" type="submit">ارسال</button>
                        </div>

                    </form>

                </div>

            </div>
        </div>
    </div>

    <div id="footer"></div>
    <script src="http://localhost/HYPERION/js/jackpot.js"></script>
    <script src="../js/helppage.js"></script>
    <script src="../js/jsforheaderandfooterlink.js"></script>
    

</body>

</html>
